<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PDF Maker</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #333;
    }

    h1 {
      color: #1a73e8;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      background-color: #1a73e8;
      color: #ffffff;
      text-decoration: none;
      border-radius: 5px;
      margin-top: 15px;
      font-weight: bold;
    }

    .btn:hover {
      background-color: #1557b0;
    }
  </style>
</head>

<body>

  <h1>PDF Maker</h1>

  <p>
    PDF Maker is a simple Android app that helps you create and manage
    PDF documents easily on your Android device.
  </p>

  <p>
    Create PDFs from supported content, save your documents and use
    convenient tools for everyday PDF tasks.
  </p>

  <p>
    Please read our privacy policy:
    <br>

    <a
      class="btn"
      href="https://sites.google.com/view/pdf-maker-privacy-policy/home"
      target="_blank"
      rel="noopener noreferrer">
      View Privacy Policy
    </a>
  </p>

</body>
</html>
